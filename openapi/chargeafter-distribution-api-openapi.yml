openapi: 3.0.1
info:
  title: Distribution API
  description: Welcome to ChargeAfter API reference! This API is implemented in a RESTful state of mind, it has straight-forward,
    resource-oriented endpoints, and produces standard HTTP response codes to communicate back the result of operations. To
    get started please contact ChargeAfter support to get your API keys, and get an access to your testing and live environments.
  termsOfService: https://chargeafter.com/privacy-policy
  contact:
    name: Customer Support
    email: support@chargeafter.com
  version: 0.0.5+bf6238465dcb01cfc82360350426730cb9363c90
servers:
- url: https://api-sandbox.ca-dev.co
  description: Local Environment
- url: https://api.chargeafter.com
  description: Production Environment
security:
- apiKey: []
paths:
  /v2/checkout/accounts:
    post:
      tags:
      - Checkout
      summary: Get accounts with offers for consumer
      description: Looks up an existing account and returns relevant offers. If there is no existing account, this creates
        a new account and returns relevant offers.
      parameters:
      - name: lookupOnly
        in: query
        description: Optional flag to indicate that only account lookup should be performed. If TRUE, then if there is no
          existing account, a new account will not be created.
        schema:
          type: boolean
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ChargeAfter.Distribution.WebApi.Contracts.Requests.GetAccountsRequestBody'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ChargeAfter.Distribution.WebApi.Contracts.Requests.GetAccountsRequestBody'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ChargeAfter.Distribution.WebApi.Contracts.Requests.GetAccountsRequestBody'
          application/*+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ChargeAfter.Distribution.WebApi.Contracts.Requests.GetAccountsRequestBody'
