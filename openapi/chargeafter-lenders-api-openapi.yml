  /api/disputes/lenders/{id}:
    get:
      tags:
      - Lenders
      summary: Get dispute details
      description: Get dispute details for a given ChargeAfter dispute `id` or `LenderDisputeId`.
      parameters:
      - name: id
        in: path
        description: 'Can be either the `LenderDisputeId` or the ChargeAfter dispute `id`.

          If you use the `LenderDisputeId`, you must also send the `useLenderDisputeId` parameter with the value of `true`.'
        required: true
        schema:
          minLength: 1
          type: string
          description: 'Can be either the `LenderDisputeId` or the ChargeAfter dispute `id`.

            If you use the `LenderDisputeId`, you must also send the `useLenderDisputeId` parameter with the value of `true`.'
      - name: useLenderDisputeId
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeAfter.Disputes.WebApi.Contracts.Dispute'
        '400':
          description: Bad Request Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    example: Unique RequestId
                  message:
                    type: string
                    example: Message Describing The Error
        '401':
          description: Unauthorized
        '404':
          description: Not Found:<br/><ul><li><i>1002</i> - Resource not found</li></ul>
          content:
            application/json:
              schema:
                properties:
                  requestId:
                    type: string
                    description: Associated request id
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Error code
                        description:
                          type: string
                          description: Error description
                example:
                  requestId: Unique RequestId
                  errors:
                  - code: '1002'
                    description: Resource not found
        '500':
          description: General Server Error
          content:
            application/json:
              schema:
                example:
                  requestId: Unique RequestId
                  errors:
                  - code: '1'
                    description: Internal unknown error occurred
components:
  schemas:
    ChargeAfter.Disputes.WebApi.Contracts.Dispute:
      required:
      - createdAt
      - id
      - origin
      - status
      - statusUpdatedAt
      - updatedAt
      type: object
      properties:
        id:
          minLength: 1
          type: string
        createdAt:
          type: string
          description: In ISO 8601
          format: date-time
        updatedAt:
          type: string
          description: In ISO 8601
          format: date-time
        status:
          $ref: '#/components/schemas/ChargeAfter.Disputes.WebApi.Contracts.DisputeStatus'
        origin:
          $ref: '#/components/schemas/ChargeAfter.Disputes.WebApi.Contracts.Party'
        statusUpdatedAt:
          type: string
          description: Last status update timestamp in ISO 8601, defaults to `createdAt`
          format: date-time
        supportingDocuments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ChargeAfter.Disputes.WebApi.Contracts.Document'
        notes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ChargeAfter.Disputes.WebApi.Contracts.Note'
        chargeback:
          $ref: '#/components/schemas/ChargeAfter.Disputes.WebApi.Contracts.Chargeback'
        proposedAmount:
          type:
          - number
          - 'null'
          format: double
        lenderDisputeId:
          type:
          - string
          - 'null'
          description: 'An ID used in the Lender system to identify the dispute. Must be unique within a single Lender.<br />

            (used for idempotency check)'
        lenderCorrelationId:
          type:
          - string
          - 'null'
          description: An ID used in the Lender system (same ID that is used to identify a disputed order or a charge).
        reason:
          $ref: '#/components/schemas/ChargeAfter.Disputes.WebApi.Contracts.DisputeReason'
        subReason:
          $ref: '#/components/schemas/ChargeAfter.Disputes.WebApi.Contracts.DisputeSubReason'
        lenderCreatedAt:
          type:
          - string
          - 'null'
          description: Dispute creation timestamp in the Lender system in ISO 8601
          format: date-time
        lenderCaseId:
          type:
          - string
          - 'null'
          description: Lender case identifier that can be used for both parties communication
        sla:
          $ref: '#/components/schemas/ChargeAfter.Disputes.WebApi.Contracts.SLA'
        details:
          $ref: '#/components/schemas/ChargeAfter.Disputes.WebApi.Contracts.DisputeDetails'
        lenderMetadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: Lender metadata can be used extend the dispute with additional information
      additionalProperties: false
    ChargeAfter.Disputes.WebApi.Contracts.Document:
      required:
      - header
      - name
      - url
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 1
          type: string
          description: Unique within a dispute
        mimeType:
          maxLength: 32
          type:
          - string
          - 'null'
        url:
          maxLength: 512
          minLength: 1
          type: string
        header:
          $ref: '#/components/schemas/ChargeAfter.Disputes.WebApi.Contracts.DataHeader'
      additionalProperties: false
    ChargeAfter.Disputes.WebApi.Contracts.DisputeStatus:
      enum:
      - PendingMerchant
      - PendingLender
      - ResolvedMerchantFavor
      - ResolvedCancelled
      - ResolvedCustomerFavorFull
      - ResolvedCustomerFavorPartial
      type: string
      description: '* `PendingMerchant` - pending merchant response

        * `PendingLender` - pending lender response or decision. The lender should `assign` or `resolve` the dispute to change the status.

        * `ResolvedMerchantFavor` -  in favor of merchant

        * `ResolvedCancelled` -  in favor of merchant

        * `ResolvedCustomerFavorFull` -  in favor of consumer

        * `ResolvedCustomerFavorPartial` -  in favor of consumer'
    ChargeAfter.Disputes.WebApi.Contracts.DisputeReason:
      enum:
      - CancelledByUser
      - IncorrectAmount
      - IncorrectLoan
      - GoodsNeverReceived
      - GoodsNotAsExpected
      - GoodsDamaged
      - GoodsReturned
      - Other
      type: string
      description: '* `CancelledByUser` - user cancelled the purchase according to cancellation policy

        * `IncorrectAmount` - user was charged or refunded by a wrong amount. Additional details can be specified in `subReason`

        * `IncorrectLoan` - user does not recognize the loan. Additional details can be specified in `subReason`

        * `GoodsNeverReceived` - user did not receive the goods

        * `GoodsNotAsExpected` - user received unexpected goods

        * `GoodsDamaged` - user received damaged goods

        * `GoodsReturned` - user received and returned the goods according to return policy

        * `Other` - any other reason not mentioned above'
