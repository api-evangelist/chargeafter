                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Error code
                        description:
                          type: string
                          description: Error description
                example:
                  requestId: Unique RequestId
                  errors:
                  - code: '1000'
                    description: Unknown error occurred
  /v3/session/accounts:
    servers:
    - url: https://api-sandbox.ca-dev.co
      description: Sandbox Environment
    - url: https://api.chargeafter.com
      description: Production Environment
    get:
      tags:
      - Accounts
      summary: Get lender accounts and offers
      parameters:
      - name: lookupOnly
        in: query
        description: Optional flag to indicate that only lookup should be performed
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ChargeAfter.Libraries.WebApi.Contracts.Responses.Offers.GetAccountsResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeAfter.Libraries.WebApi.Contracts.Responses.Offers.GetAccountsResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ChargeAfter.Libraries.WebApi.Contracts.Responses.Offers.GetAccountsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    example: Unique RequestId
                  message:
                    type: string
                    example: Message Describing The Error
        '401':
          description: Unauthorized
        '422':
          description: Input Validation Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      properties:
                        field:
                          type: string
                        validationState:
                          type: string
                        error:
                          type: string
                example:
                  RequestId: Unique RequestId
                  Message: Input Validation Failure
                  Errors:
                  - Field: RequestField1
                    ValidationState: Invalid
                    Error: RequestField1 should be up to 150 characters, and can contain a-z, A-Z, _ characters.
        '500':
          description: General Server Error
          content:
            application/json:
              schema:
                example:
                  requestId: Unique RequestId
                  errors:
                  - code: '1'
                    description: Internal unknown error occurred
