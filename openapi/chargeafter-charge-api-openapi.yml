openapi: 3.0.1
info:
  title: Charge API
  description: Welcome to ChargeAfter API reference! This API is implemented in a RESTful state of mind, it has straight-forward,
    resource-oriented endpoints, and produces standard HTTP response codes to communicate back the result of operations. To
    get started please contact ChargeAfter support to get your API keys, and get an access to your testing and live environments.
  termsOfService: https://chargeafter.com/privacy-policy
  contact:
    name: Customer Support
    email: support@chargeafter.com
  version: 1.2.45+20181a21407d1df1b163085f2b159570f697241a
paths:
  /v2/accounts/charge:
    post:
      tags:
      - Accounts
      summary: Create new charge with accountToken
      description: Creates a new charge from an existing approved account with an accountToken.
      parameters: []
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ChargeAfter.PostsaleAdapter.WebApi.Contracts.CreateChargeFromAccountRequestBody'
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ChargeAfter.PostsaleAdapter.WebApi.Contracts.CreateChargeFromAccountRequestBody'
          text/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ChargeAfter.PostsaleAdapter.WebApi.Contracts.CreateChargeFromAccountRequestBody'
          application/*+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ChargeAfter.PostsaleAdapter.WebApi.Contracts.CreateChargeFromAccountRequestBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeAfter.PostsaleAdapter.WebApi.Contracts.ChargeCreationResponseDto'
        '202':
          description: Charge created, failed to settle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeAfter.PostsaleAdapter.WebApi.Contracts.ChargeCreationResponseDto'
        '400':
          description: Bad Request:<br/><ul><li><i>1110</i> - &lt;validation error&gt;</li><li><i>2002</i> - charge already
            has assigned confirmation</li><li><i>2004</i> - confirmation not found</li></ul>
          content:
            application/json:
              schema:
                properties:
                  requestId:
                    type: string
                    description: Associated request id
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Error code
                        description:
                          type: string
                          description: Error description
                example:
                  requestId: Unique RequestId
                  errors:
                  - code: '1110'
                    description: <validation error>
                  - code: '2002'
                    description: charge already has assigned confirmation
                  - code: '2004'
                    description: confirmation not found
        '401':
          description: Unauthorized
        '404':
          description: Account not found
        '422':
          description: Input Validation Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      properties:
                        field:
                          type: string
                        validationState:
                          type: string
                        error:
                          type: string
                example:
                  RequestId: Unique RequestId
                  Message: Input Validation Failure
                  Errors:
                  - Field: RequestField1
                    ValidationState: Invalid
                    Error: RequestField1 should be up to 150 characters, and can contain a-z, A-Z, _ characters.
        '500':
          description: General Server Error
          content:
            application/json:
              schema:
                properties:
                  requestId:
                    type: string
                    description: Associated request id
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Error code
                        description:
                          type: string
                          description: Error description
                example:
                  requestId: Unique RequestId
                  errors:
                  - code: '1000'
                    description: Unknown error occurred
