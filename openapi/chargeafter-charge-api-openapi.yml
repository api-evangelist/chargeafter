  /v2/post-sale/charges:
    post:
      tags:
      - Charges
      summary: Create a new Charge
      description: "Creates a new charge by initiating a new authorize transaction.\r\nUse the returned ChargedId for other\
        \ post-sale operations"
      parameters:
      - name: settle
        in: query
        description: "(Optional)\r\n            \r\nA flag indicating whether a settle request should be sent to the lender\
          \ as well."
        schema:
          type: boolean
          description: "(Optional)\r\n            \r\nA flag indicating whether a settle request should be sent to the lender\
            \ as well."
      requestBody:
        content:
          application/json-patch+json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ChargeAfter.PostsaleAdapter.WebApi.Contracts.NewChargeFromConfirmationBodyDto'
          application/json:
