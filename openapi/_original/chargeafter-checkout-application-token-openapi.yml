openapi: 3.0.1
info:
  title: Checkout Management
  description: Welcome to ChargeAfter API reference! This API is implemented in a RESTful state of mind, it has straight-forward,
    resource-oriented endpoints, and produces standard HTTP response codes to communicate back the result of operations. To
    get started please contact ChargeAfter support to get your API keys, and get an access to your testing and live environments.
  termsOfService: https://chargeafter.com/privacy-policy
  contact:
    name: Customer Support
    email: support@chargeafter.com
  version: 2.2.59+73d80b2d26f5724ff2d14882558201510ffa8545
servers:
- url: https://api-sandbox.ca-dev.co
  description: Sandbox Environment
- url: https://api.chargeafter.com
  description: Production Environment
security:
- apiKey: []
paths:
  /v2/checkout/applications/{applicationId}/token:
    get:
      tags:
      - ApplicationsV3
      summary: Get interactive token
      description: Returns a time-limited interactive session token to resume the Checkout flow for an account associated
        with the application.
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ChargeAfter.BFF.WebApi.Contracts.GetSessionTokenResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeAfter.BFF.WebApi.Contracts.GetSessionTokenResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/ChargeAfter.BFF.WebApi.Contracts.GetSessionTokenResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    example: Unique RequestId
                  message:
                    type: string
                    example: Message Describing The Error
        '401':
          description: Unauthorized
        '422':
          description: Input Validation Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      properties:
                        field:
                          type: string
                        validationState:
                          type: string
                        error:
                          type: string
                example:
                  RequestId: Unique RequestId
                  Message: Input Validation Failure
                  Errors:
                  - Field: RequestField1
                    ValidationState: Invalid
                    Error: RequestField1 should be up to 150 characters, and can contain a-z, A-Z, _ characters.
        '500':
          description: General Server Error
          content:
            application/json:
              schema:
                example:
                  requestId: Unique RequestId
                  errors:
                  - code: '1'
                    description: Internal unknown error occurred
