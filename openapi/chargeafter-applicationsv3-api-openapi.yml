              schema:
                example:
                  requestId: Unique RequestId
                  errors:
                  - code: '1'
                    description: Internal unknown error occurred
components:
  schemas:
    ChargeAfter.BFF.WebApi.Contracts.Responses.Models.SessionStatusPromoSettings:
      type: object
      properties:
        numberOfPeriods:
          type:
          - integer
          - 'null'
          description: Number of period in which promotion is active provided in case isPromo = true
          format: int32
          example: 6
        periodicPayment:
          type:
          - number
          - 'null'
          description: Periodic payment for each promotion period provided in case isPromo = true
          format: double
          example: 100.5
        periodType:
          allOf:
          - $ref: '#/components/schemas/ChargeAfter.Libraries.Entities.PeriodType'
          description: Type of period periodic payment and number of periods are defined for provided in case isPromo = true
          example: Month
        apr:
          type:
          - number
          - 'null'
          description: Annual Percentage Rate (APR) during promotional period provided in case isPromo = true
          format: double
          example: 10.25
      additionalProperties: false
    ChargeAfter.Libraries.WebApi.Contracts.Requests.Models.Discount:
      required:
      - amount
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Name of the discount.
          example: Birthday discount
        amount:
          type: number
          description: Amount of the discount.
          format: double
          example: 20
      additionalProperties: false
      description: Discount details.
    ChargeAfter.Libraries.WebApi.Contracts.Requests.Models.FlowType:
      enum:
      - Apply
      - Checkout
      type: string
      description: FlowType.<p>Description:</p><ul><li><i>Apply</i> - Consumer checks if cart eligible.</li><li><i>Checkout</i> - Consumer makes purchasing in merchant.</li></ul>
    ChargeAfter.Libraries.WebApi.Contracts.Responses.Offers.Models.FinancialProductType:
      enum:
      - LineOfCredit
      - Installments
      - LeaseToOwn
      - MerchantSelfFinancing
      type: string
    ChargeAfter.BFF.WebApi.Contracts.GetSessionTokenResponse:
      type: object
      properties:
        sessionToken:
          type:
          - string
          - 'null'
          description: Session token which can be used to open modal in context of existing session
      additionalProperties: false
    ChargeAfter.Libraries.Entities.PeriodType:
      enum:
      - Day
      - Month
      - Week
      - BiWeek
      type: string
    ChargeAfter.BFF.WebApi.Contracts.Responses.Models.SessionStatusAccount:
      required:
      - lenderId
      - lenderName
      type: object
      properties:
        lenderName:
          minLength: 1
          type: string
          description: Lender display name.<br /><b>Note:</b> Because this value may change, customers should not bind to this parameter. Instead, bind to the lenderId and set the lenderName in your system.
          example: Test Lender
        lenderId:
          minLength: 1
          type: string
          description: Unique identifier of the lender
          example: 66cdb92ed0038406592430c1
        creditInfo:
          allOf:
          - $ref: '#/components/schemas/ChargeAfter.Libraries.WebApi.Contracts.Responses.Offers.Models.CreditInfo'
          description: Credit amount details
        applicationStatus:
          allOf:
          - $ref: '#/components/schemas/ChargeAfter.Libraries.Entities.ConsumerApplicationStatus'
          description: Gets or sets the application status.
        applicationStatusReason:
          allOf:
          - $ref: '#/components/schemas/ChargeAfter.Libraries.Entities.ApplicationStatusReason'
          description: Gets or sets the application status reason.
        accountStatus:
          allOf:
          - $ref: '#/components/schemas/ChargeAfter.Libraries.Entities.LenderAccountStatus'
          description: Gets or sets the account status.
        accountStatusReason:
          allOf:
          - $ref: '#/components/schemas/ChargeAfter.Libraries.Entities.AccountStatusReason'
          description: Gets or sets the account status reason.
        lenderReferenceId:
          type:
          - string
          - 'null'
          description: The lender reference ID
      additionalProperties: false
    ChargeAfter.Libraries.WebApi.Contracts.Requests.Models.CartDetails:
      required:
      - items
      - totalAmount
      type: object
      properties:
        merchantOrderId:
          type:
          - string
          - 'null'
          description: Optional merchant order identifier.
          example: '12345'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChargeAfter.Libraries.WebApi.Contracts.Requests.Models.Item'
          description: Line items.
        discounts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ChargeAfter.Libraries.WebApi.Contracts.Requests.Models.Discount'
          description: Optional discounts.
        taxAmount:
          type: number
          description: Total tax amount.
          format: double
          example: 199
        shippingTaxAmount:
          type:
          - number
          - 'null'
          description: Shipping tax amount.
          format: double
          example: 1.9
        shippingAmount:
          type:
          - number
          - 'null'
          description: Shipping amount.
          format: double
          example: 19
        totalAmount:
          type: number
          description: 'Total amount.<br />

            Must be equal to the sum of all items - discounts + tax and shipping.'
          format: double
          example: 4297.9
      additionalProperties: false
      description: Order cart details. Mandatory for checkout, optional for apply flow.
    ChargeAfter.Libraries.WebApi.Contracts.Requests.Models.Item:
      required:
      - price
      - quantity
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Item name.
          example: Awesome Product
        price:
          type: number
          description: Price of a single item.
          format: double
          example: 1999
        sku:
          type:
          - string
          - 'null'
          description: Item SKU.
          example: AWSMPRDCT
        quantity:
          type: integer
          description: Number of items.
          format: int32
          example: 2
        leasable:
          type:
          - boolean
          - 'null'
          description: Indicates if the item is leasable (i.e. can be financed by LTO lender).
          example: true
        productCategory:
          type:
          - string
          - 'null'
          description: Optional product category.
          example: Product category
        warranty:
          allOf:
          - $ref: '#/components/schemas/ChargeAfter.Libraries.WebApi.Contracts.Requests.Models.Warranty'
