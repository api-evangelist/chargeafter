          description: "The charge ID.\n            \nThis should be used for further post-sale operations."
          example: 9c34bcd1aaf3a1000712da86
        merchantOrderId:
          minLength: 1
          type: string
          description: The merchant order ID as provided in the original request.
          example: 0123456789
        totalAmount:
          type: number
          description: The charge amount.
          format: double
          example: 864.93
        refundedAmount:
          type: number
          description: The amount that was settled on the charge.
          format: double
          example: 164.93
        settledAmount:
          type: number
          description: The amount that was refunded on the charge.
          format: double
          example: 264.93
        lender:
          allOf:
