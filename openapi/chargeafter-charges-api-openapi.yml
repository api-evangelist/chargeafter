          example: Accepted
        settleTransactionState:
          allOf:
          - $ref: '#/components/schemas/ChargeAfter.Libraries.Entities.TransactionState'
          description: Settle transaction state in case of autosettle.
          example: Accepted
      additionalProperties: false
    ChargeAfter.PostsaleAdapter.WebApi.Contracts.TransactionType:
      enum:
      - Settle
      - Refund
      - Void
      - Chargeback
      - Reversal
      type: string
      description: <p>Description:</p><ul><li><i>Settle</i> - Transaction is settled</li><li><i>Refund</i> - Settled transaction is refunded</li><li><i>Void</i> - Transaction is voided</li><li><i>Chargeback</i> - Chargack is created</li><li><i>Reversal</i> - Chargeback reversal is created</li></ul>
    ChargeAfter.PostsaleAdapter.WebApi.Contracts.SettleActionBodyDto:
      type: object
      properties:
        amount:
          type: number
          description: 'The transaction amount.

            If no request body is supplied, the full authorize amount will be settled.

            If an amount is supplied it must not be higher than the authorized amount.'
          format: double
          example: 864.93
        merchantTransactionId:
          maxLength: 256
          type:
          - string
          - 'null'
          description: "(Optional)\nMerchant supplied identifier for the transactions.\n            \nShould be unique per merchant request."
          example: 1a13423d
      additionalProperties: false
    ChargeAfter.PostsaleAdapter.WebApi.Contracts.OfferDto:
      type: object
      properties:
        lender:
          allOf:
          - $ref: '#/components/schemas/ChargeAfter.PostsaleAdapter.WebApi.Contracts.LenderDto'
          description: Details about the selected lender.
        paymentPlan:
          allOf:
          - $ref: '#/components/schemas/ChargeAfter.PostsaleAdapter.WebApi.Contracts.PaymentPlanDto'
          description: Details about the selected payment plan.
      additionalProperties: false
    ChargeAfter.PostsaleAdapter.WebApi.Contracts.ChargeActionBaseResponseDto:
      required:
      - amount
      - chargeId
      - createdAt
      - id
      - lenderId
      - merchantId
      - merchantOrderId
      - status
      - type
      - updatedAt
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The transaction ID.
          example: 65650abe4f457d08b9710584
        chargeId:
          minLength: 1
          type: string
          description: The charge ID.
          example: 9c34bcd1aaf3a1000712da86
        merchantOrderId:
          maxLength: 256
          minLength: 1
          type: string
          description: The merchant order ID as provided in the original request.
          example: 0123456789
        storeId:
          type: string
          description: The store ID of the original purchase.
          example: store1
        lenderId:
          minLength: 1
          type: string
          description: The lender's ID.
          example: 62c6a4e8f2c5dab96d1f1fa3
        amount:
          type: number
          description: The transaction amount.
          format: double
          example: 164.93
        type:
          minLength: 1
          type: string
          description: 'The transaction type.

            Possible values: AUTHORIZE, SETTLE, REFUND, VOID, CHARGEBACK, REVERSAL.'
          example: VOID
        merchantId:
          minLength: 1
          type: string
          description: The merchant ID.
          example: 651d621c1f1cc3298ef9b878
        createdAt:
          type: string
          description: The transaction creation date.
          format: date-time
          example: '2023-11-13T10:21:12.9277886Z'
        updatedAt:
          type: string
          description: The transaction update date.
          format: date-time
          example: '2023-11-13T10:21:12.9277886Z'
        lenderReferenceId:
          type: string
          description: Lender's reference Id of the transaction.
          example: 654e684a5a3487942359537f_935AC8088
        status:
          allOf:
          - $ref: '#/components/schemas/ChargeAfter.PostsaleAdapter.WebApi.Contracts.ChargeStatus'
          description: 'The charge status.

            Please refer to Charge states page in order to review possible statuses of the action.'
          example: Voided
        transactionState:
          allOf:
          - $ref: '#/components/schemas/ChargeAfter.Libraries.Entities.TransactionState'
          description: The transaction state.
          example: Accepted
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: 'Metadata provided by the lender outlining additional actions necessary for processing

            the transaction'
      additionalProperties: false
  securitySchemes:
    apiKey:
      type: apiKey
      description: ChargeAfter API supports an API key based authentication, provided in the `apiKey` HTTP header.
      name: Authorization
      in: header
