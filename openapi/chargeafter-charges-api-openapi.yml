          example: d4fbb3e2aeb2476b99cf9aa6dc13cb78
      additionalProperties: false
    ChargeAfter.PostsaleAdapter.WebApi.Contracts.ChargeDto:
      required:
      - applicationId
      - channel
      - consumerId
      - createdAt
      - id
      - lender
      - merchantOrderId
      - paymentPlan
      - refundedAmount
      - settledAmount
      - state
      - totalAmount
      - updatedAt
      type: object
      properties:
        id:
          minLength: 1
