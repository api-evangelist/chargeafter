          description: Details about the selected lender.
        paymentPlan:
          allOf:
          - $ref: '#/components/schemas/ChargeAfter.PostsaleAdapter.WebApi.Contracts.PaymentPlanDto'
          description: Details about the selected payment plan.
        state:
          minLength: 1
          type: string
          description: 'The state of the charge.

            Supported values: CREATED, AUTHORIZED, PARTIALLY_SETTLED_REFUNDED, SETTLED, REFUNDED, VOIDED, CHARGEDBACK,

            PARTIALLY_SETTLED_PARTIALLY_REFUNDED, SETTLED_PARTIALLY_REFUNDED, PARTIALLY_SETTLED, PARTIALLY_REFUNDED'
          example: AUTHORIZED
        storeId:
          type: string
          description: The store ID of the original purchase.
          example: store1
        consumerId:
          minLength: 1
          type: string
          description: The consumer's ID
          example: 66f69f97702dc5226f7acccc
        createdAt:
          type: string
          description: The charge creation date.
          format: date-time
          example: '2023-11-13T10:21:12.9277886Z'
        updatedAt:
          type: string
          description: The charge update date.
          format: date-time
          example: '2023-11-13T10:21:12.9277886Z'
        channel:
          minLength: 1
          type: string
          description: The channel of the original purchase.
          example: E_COMMERCE
        applicationId:
          minLength: 1
          type: string
          description: The CA application id of the original purchase.
          example: 6624efdd60c853bc11a56c61
