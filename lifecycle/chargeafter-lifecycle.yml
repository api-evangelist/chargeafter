    superseded builds of the same API (e.g. Charge API 1.1.1950 alongside 1.2.45; OmniLink 1.1.0, 1.7.7 and
    1.11.8; Consumer API 1.0.0, 2.1.1413, 2.2.9 and 2.3.29). Eight catalog entries now return 404. Nothing
    in the catalog marks which definition is current, so a consumer reading the catalog cannot tell a live
