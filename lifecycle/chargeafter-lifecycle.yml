  sunset_header: false
  deprecation_header: false
  notice_period: not specified
  communication: release notes and mailing list
  breaking_changes:
  - endpoint deprecations
  - changes in data structures
  - alterations to authentication methods
  non_breaking_changes:
  - addition of a response body where none previously existed
  - reordering of fields
  - addition of new enum values where a default is defined
  - addition of optional or read-only fields
  detail: >-
    ChargeAfter states it "specif[ies] deprecation timelines and provide[s] alternatives whenever possible"
    but publishes no concrete notice period, and supports neither RFC 8594 Sunset nor the Deprecation header.
