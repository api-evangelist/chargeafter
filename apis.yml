aid: chargeafter
name: ChargeAfter
description: >-
  ChargeAfter is an embedded lending and point-of-sale financing platform that connects merchants to an
  independent network of 40+ lenders, returning personalized consumer financing offers at checkout across
  online, in-store, and call-center channels. Merchants integrate through a client-side JavaScript SDK
  (Apply, Checkout, and promotional widgets), through ecommerce plugins for Shopify, Magento 2, WooCommerce,
  BigCommerce, NopCommerce, Shopware and Miva, or directly against a bearer-authenticated REST API that
  covers sessions and offers, application status, accounts, charges (settle, refund, void, delivery),
  consumer lookup, funding reconciliation reports, omni-link generation, and lender dispute management.
  The merchant back office is Operate, and event notifications are delivered as webhooks.
