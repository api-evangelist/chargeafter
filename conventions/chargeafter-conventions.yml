  scope: Disputes Management for Lenders API
  key_field: lenderDisputeId
  operation: PUT /api/disputes/lenders (Create a dispute)
  semantics: >-
    "This call is idempotent. If there is an existing dispute with the same `lenderDisputeId` sent in a
    request, its ChargeAfter dispute `id` will be returned." The key must be unique within a single lender.
  retention: not documented
  header: none — ChargeAfter defines no Idempotency-Key request header anywhere in its 46 published operations
  gap: >-
    Money-moving operations have NO idempotency contract. POST /v2/post-sale/charges,
    /v2/post-sale/charges/{chargeid}/settles, /refunds and /voids all lack an idempotency key, so a retried
    request after a timeout can double-charge, double-settle, or double-refund. This is the single largest
    runtime-semantics gap in the ChargeAfter contract.
  source: openapi/chargeafter-disputes-management-lenders-openapi.yml
